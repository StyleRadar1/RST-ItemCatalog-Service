server:
  port: ${SERVER_PORT:8220}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-item-catalogo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:styleradar_item_catalog}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # En QA y PROD: puerto 5671 con TLS y el usuario asignado al servicio
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    # 3 intentos con espera creciente (1 s, 2 s) y luego a la cola de errores
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2

styleradar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:styleradar.exchange}
    dlx: ${RABBITMQ_DLX:styleradar.dlx}
    dlq: ${RABBITMQ_DLQ:styleradar.catalogo.dlq}
    dlq-routing-key: ${RABBITMQ_DLQ_ROUTING_KEY:styleradar.catalogo.error}
    queues:
      inventario: ${RABBITMQ_QUEUE_INVENTARIO:styleradar.catalogo.inventario-actualizado.q}
      suscripcion: ${RABBITMQ_QUEUE_SUSCRIPCION:styleradar.catalogo.suscripcion-suspendida.q}
    routing-keys:
      prenda-publicada: styleradar.catalogo.prenda.publicada
      prenda-retirada: styleradar.catalogo.prenda.retirada
      moderacion-cambiada: styleradar.catalogo.moderacion.cambiada
      inventario-actualizado: styleradar.inventario.actualizado
      suscripcion-suspendida: ${RABBITMQ_RK_SUSCRIPCION:styleradar.pagos.suscripcion.suspendida}

geolocalizacion:
  url: ${GEOLOCALIZACION_URL:http://localhost:8240/api/v1}

inventario:
  url: ${INVENTARIO_URL:http://localhost:8200/api/v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info
